services:
  amazonpaws:
    image: "ghcr.io/varbin/amazonpaws"
    restart: unless-stopped
    # Uncomment if you use Traeffik.
    #ports:
    #- "127.0.0.1:3000:3000"
    environment:
      # Provide those in an env file!
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_REGION: "${S3_REGION}"
      S3_PATH_STYLE: "${S3_PATH_STYLE}"
      AUTH_KEY: "${AUTH_KEY}"
      SECRET_KEY: "${SECRET_KEY}"
      MONGO_URL: "${MONGO_URL}"

      HOSTNAME: '0.0.0.0'

      # Uncomment if you pass your legal details.
      #LEGAL_FILE: '/legal.html'

    volumes: [
      #'./legal.html:/legal.html'
    ]